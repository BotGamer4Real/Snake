[package]
name = "snake"
version = "0.1.0"
description = "Classic Snake"
authors = ["BotGamer4Real"]
edition = "2021"

[lib]
name = "snake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
